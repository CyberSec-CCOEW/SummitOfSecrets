<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SRJU Insurance – Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#1f2937,#05070c);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}

/* WINDOW */
.window{
  width:560px;               /* 👈 wider (landscape) */
  background:rgba(15,18,25,0.78);
  backdrop-filter:blur(22px);
  border-radius:18px;
  box-shadow:0 40px 80px rgba(0,0,0,0.65);
  overflow:hidden;
  transition:transform .35s ease,opacity .35s ease;
}

.window.minimized{
  transform:scale(.85) translateY(140%);
  opacity:0;
  pointer-events:none;
}

.window.maximized{
  width:100vw;
  height:100vh;
  border-radius:0;
}

/* TITLE BAR */
.titlebar{
  height:44px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.controls{
  display:flex;
  gap:8px;
}

.controls span{
  width:12px;
  height:12px;
  border-radius:50%;
  cursor:pointer;
}

.red{background:#ff5f57;}
.yellow{background:#ffbd2e;}
.green{background:#28c840;}

/* CONTENT */
.content{
  padding:44px 56px 40px;    /* more horizontal breathing room */
  text-align:center;
}

h1{
  margin:14px 0 6px;
  font-size:22px;
  font-weight:600;
}

p{
  color:#a1a1a6;
  font-size:13px;
  margin-bottom:30px;
}

/* INPUTS — MATCH HOME GLASS STYLE */
input{
  width:100%;
  padding:15px;
  margin-bottom:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.12);
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.04)
  );
  backdrop-filter:blur(14px);
  color:#fff;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:#9ca3af;
}

input:focus{
  border-color:#4facfe;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.16),
    rgba(255,255,255,0.06)
  );
}

/* BUTTON */
button{
  width:100%;
  padding:15px;
  margin-top:6px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  color:#000;
  background:linear-gradient(90deg,#4facfe,#00f2fe);
  box-shadow:0 10px 30px rgba(0,0,0,0.45);
  transition:all .25s ease;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 36px rgba(0,0,0,0.6);
}

/* ERROR */
.error{
  margin-top:12px;
  font-size:13px;
  color:#ff5f57;
  display:none;
}

/* FOOTER */
.footer{
  margin-top:28px;
  font-size:12px;
  color:#8e8e93;
}
</style>
</head>

<body>

<div class="window">
  <div class="titlebar">
    <div class="controls">
      <span class="red" onclick="macClose()"></span>
      <span class="yellow" onclick="macMinimize()"></span>
      <span class="green" onclick="macMaximize()"></span>
    </div>
  </div>

  <div class="content">
    <h1>SRJU Insurance</h1>
    <p>Internal Employee Access Portal</p>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <div class="error" id="error">Invalid credentials</div>

    <div class="footer">© 2026 SRJU Insurance</div>
  </div>
</div>

<script>
let isMax=false;

function macClose(){
  document.querySelector('.window').style.display="none";
}

function macMinimize(){
  const w=document.querySelector('.window');
  w.classList.add('minimized');
  document.body.onclick=()=>{
    w.classList.remove('minimized');
    document.body.onclick=null;
  };
}

function macMaximize(){
  document.querySelector('.window').classList.toggle('maximized');
  isMax=!isMax;
}

function login(){
  const u=username.value.trim();
  const p=password.value.trim();

  if(u==="admin" && p==="srju123"){
    sessionStorage.setItem("srju_auth","true");
    location.href="insurance-home.html";
  }else{
    error.style.display="block";
  }
}
</script>

</body>
</html>
